plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            args '--mixin', 'flowline.mixins.json'
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'forge.enabledGameTestNamespaces', mod_id
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {}

        server {
            args '--nogui'
        }

        // Headless in-world tests: ./gradlew runGameTestServer (exits non-zero if a test fails)
        gameTestServer {
            // Optional-mod tests need independent registry snapshots and saved worlds.
            workingDirectory project.file(project.hasProperty('withCurvy') ? 'run/gametest-curvy' : 'run/gametest-normal')
        }
    }
}

// Optional integrations: compiled against their APIs only, never required at runtime.
// Not exclusiveContent: fg.deobf() serves the remapped jars from ForgeGradle's own repo, which an exclusive
// filter would hide.
repositories {
    mavenCentral()
    maven {
        url = 'https://maven.blamejared.com'
        content { includeGroup 'mezz.jei' }
    }
    maven {
        url = 'https://maven.terraformersmc.com/releases/'
        content { includeGroup 'dev.emi' }
    }
    maven {
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        url = 'https://modmaven.dev/'
        content { includeGroup 'mekanism' }
    }
    maven {
        url = 'https://maven.k-4u.nl/'
        content { includeGroup 'mcjty.theoneprobe' }
    }
    maven {
        url = 'https://maven.bai.lol'
        content { includeGroup 'mcp.mobius.waila' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Curvy is optional in production and in dev runs. Enable native integration runs with -PwithCurvy.
    if (project.hasProperty('withCurvy')) {
        runtimeOnly fg.deobf("curse.maven:curvy-pipes-1151126:8822563")
    }
    minecraftLibrary 'org.snakeyaml:snakeyaml-engine:2.7'
    jarJar(group: 'org.snakeyaml', name: 'snakeyaml-engine', version: '[2.7,2.8)')

    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    compileOnly fg.deobf("dev.emi:emi-forge:${emi_version}+${minecraft_version}:api")
    compileOnly fg.deobf("curse.maven:jade-api-324717:${jade_api_id}")
    compileOnly fg.deobf("mekanism:Mekanism:${minecraft_version}-${mekanism_version}:api")
    // TOP is compiled against without remapping: its API only uses class names, and its pom pulls in an old Forge
    compileOnly("mcjty.theoneprobe:theoneprobe:${top_version}") { transitive = false }
    compileOnly(fg.deobf("mcp.mobius.waila:wthit-api:${wthit_version}")) { transitive = false }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    archiveClassifier = 'slim'
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_authors,
                'MixinConfigs'         : 'flowline.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jarJar.enable()

reobf { jarJar {} }
tasks.named('jarJar').configure {
    archiveClassifier = ''
    finalizedBy 'reobfJarJar'
}
tasks.named('build').configure { dependsOn 'jarJar' }
