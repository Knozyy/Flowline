name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: flowline-jar
          path: |
            build/libs/*.jar
            !build/libs/*-slim.jar

      - name: In-world tests without Curvy
        run: ./gradlew runGameTestServer --stacktrace

      - name: In-world tests with Curvy
        run: ./gradlew runGameTestServer -PwithCurvy --stacktrace

      - name: In-world tests with Mekanism
        run: ./gradlew runGameTestServer -PwithMekanism --stacktrace
